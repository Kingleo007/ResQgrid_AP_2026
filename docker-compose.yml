services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: resqgrid
      POSTGRES_USER: resqgrid
      POSTGRES_PASSWORD: resqgrid
    ports: ["5432:5432"]
    volumes:
      - resqgrid-db:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqgrid -d resqgrid"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploy}
      DATABASE_URL: postgres://resqgrid:resqgrid@db:5432/resqgrid
      FRONTEND_ORIGIN: http://localhost:5173
    ports: ["4000:4000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  resqgrid-db:
