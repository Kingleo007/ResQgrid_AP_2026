services:

  postgres:
    image: postgis/postgis:17-3.5

    # Required for Apple Silicon because this image
    # may not provide an ARM64 manifest.
    platform: linux/amd64

    container_name: resqgrid-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: resqgrid
      POSTGRES_PASSWORD: resqgrid_password
      POSTGRES_DB: resqgrid

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: