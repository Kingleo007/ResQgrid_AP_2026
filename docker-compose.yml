services:

  postgres:
    image: postgis/postgis:17-3.5

    platform: linux/amd64

    container_name: resqgrid-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: resqgrid
      POSTGRES_PASSWORD: resqgrid_password
      POSTGRES_DB: resqgrid

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: resqgrid-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - postgres


volumes:
  postgres_data: